@REM ============================================================================
@REM KTP OP Anonymization - Configuration Template
@REM ============================================================================
@REM Copy to 'anonymization.ini' and fill in.
@REM
@REM Any value left BLANK or containing '<' is prompted for at runtime.
@REM Leaving passwords blank is recommended - they are not masked on screen when
@REM typed, but at least they are not stored on disk.
@REM
@REM Lines starting with @REM are comments.
@REM Values are read as NAME=VALUE. Do not quote values.
@REM ============================================================================


@REM ----------------------------------------------------------------------------
@REM Database connection
@REM ----------------------------------------------------------------------------
ORACLE_SID=<SID>
SYS_PASSWORD=<SYS_PASSWORD>
OP_PASSWORD=<OP_PASSWORD>

@REM Tablespaces for the anon_meta metadata schema (mapping, run log, inventory).
@REM These are small - a few MB even on the largest instances.
TABLESPACE_DATA=<DATA_TABLESPACE>
TABLESPACE_INDEX=<INDEX_TABLESPACE>


@REM ----------------------------------------------------------------------------
@REM What to anonymize - five categories, three switches each
@REM ----------------------------------------------------------------------------
@REM Every identifier is classified ONCE, from the data, into one category:
@REM
@REM   ENTITY              E_0000001  tiers flag N + an Entite node on w_tiers
@REM   PORTFOLIO           P_0000001  tiers flag O + any node on w_tiers
@REM   COUNTERPARTY        T_0000001  tiers flag N + another w_tiers node, no Entite
@REM   UNCLASSIFIED_PARTY  X_0000001  a party the data cannot classify - no tiers
@REM                                  row, no structure node, an unknown flag...
@REM                                  The reason is recorded with it.
@REM   BANK_ACCOUNT        CB_0000001 compte_banque, and the structure nodes on
@REM                                  the w_compte_banque screen
@REM
@REM The switches decide what is DONE with each category, never which category
@REM an identifier is in. Turning a category off cannot move its identifiers
@REM into another one.
@REM
@REM Each category has three INDEPENDENT switches:
@REM
@REM   ANONYMIZE_<CATEGORY>              rename the identifiers and every typed
@REM                                     reference to them
@REM   ANONYMIZE_<CATEGORY>_DESCRIPTION  mask description / display labels
@REM   ANONYMIZE_<CATEGORY>_ATTRIBUTES   mask sensitive attributes, addresses
@REM                                     included
@REM
@REM Labels and attributes are masked with the identifier's safe replacement
@REM (E_0000412...), so they can be masked even when the identifier itself is
@REM kept. Example - keep entity codes, mask everything else about entities:
@REM
@REM   ANONYMIZE_ENTITY=n
@REM   ANONYMIZE_ENTITY_DESCRIPTION=y
@REM   ANONYMIZE_ENTITY_ATTRIBUTES=y
@REM
@REM That is PARTIAL anonymization: verification reports it as incomplete, never
@REM as a full pass. To leave a category entirely untouched set all three to n.
@REM
@REM CHANGED: older versions treated ANONYMIZE_<CATEGORY>=n as "off for all
@REM three". A configuration written for that behaviour now masks the labels and
@REM attributes its other switches leave at y. Every run prints the resolved
@REM switches, and a note for each category where this applies.
@REM
@REM NOTE: columns marked NULL_OUT in the inventory - free text, names, emails,
@REM phone numbers, IBAN fragments - are ALWAYS erased regardless of every flag
@REM in this file. Free text is the highest-risk category and the least useful
@REM to keep, so it is not made optional.
@REM
@REM Accepted values: y / n (also yes/no, true/false, 1/0). Anything else stops
@REM the run - a typo must not switch masking off.
@REM ----------------------------------------------------------------------------

@REM Rename identifiers ...........................................................
ANONYMIZE_ENTITY=y
ANONYMIZE_PORTFOLIO=y
ANONYMIZE_COUNTERPARTY=y
ANONYMIZE_UNCLASSIFIED_PARTY=y
ANONYMIZE_BANK_ACCOUNT=y

@REM Mask description labels (was EntD / FoldD / TierD / CpteD) ...................
@REM tiers.description, compte_banque.description, structure.description.
ANONYMIZE_ENTITY_DESCRIPTION=y
ANONYMIZE_PORTFOLIO_DESCRIPTION=y
ANONYMIZE_COUNTERPARTY_DESCRIPTION=y
ANONYMIZE_UNCLASSIFIED_PARTY_DESCRIPTION=y
ANONYMIZE_BANK_ACCOUNT_DESCRIPTION=y

@REM Mask sensitive attributes (was Ent1-5 / Fold1-5 / Tier1-5 / Cpte1-5) ..........
@REM Which columns these cover is declared in the inventories with rule
@REM SELF_CODE - see config/inventory_op.csv (tiers.adresse1-adresse5) and
@REM config/inventory_op_custom.csv (contact, personal and grouping columns).
@REM An empty field stays empty: a NULL phone number is not filled in.
@REM Addresses are attributes, not descriptions.
ANONYMIZE_ENTITY_ATTRIBUTES=y
ANONYMIZE_PORTFOLIO_ATTRIBUTES=y
ANONYMIZE_COUNTERPARTY_ATTRIBUTES=y
ANONYMIZE_UNCLASSIFIED_PARTY_ATTRIBUTES=y
ANONYMIZE_BANK_ACCOUNT_ATTRIBUTES=y


@REM ----------------------------------------------------------------------------
@REM Scope decision - per client
@REM ----------------------------------------------------------------------------
@REM A bank account is found in compte_banque and in the structure tree, as a
@REM node on the w_compte_banque screen. Some nodes have no compte_banque
@REM row. By default they are bank accounts too, each with its own CB_
@REM translation. The legacy package never renamed them.
@REM
@REM   y   (default) structure-only account nodes are anonymized as accounts
@REM   n   they are not bank accounts for this client: if any exist, the run
@REM       stops before changing anything and says how many (a dry run shows
@REM       the count too)
@REM
@REM Never asked: a missing or blank value means y.
APPROVE_STRUCTURE_ONLY_ACCOUNTS=y


@REM ----------------------------------------------------------------------------
@REM Run behaviour
@REM ----------------------------------------------------------------------------

@REM Degree of parallelism for bulk UPDATEs on the large histo_* tables.
@REM Set to 1 to disable parallel DML.
PARALLEL_DEGREE=4

@REM Site-specific coverage additions. Relative to the config folder.
@REM Leave as-is unless you keep the file elsewhere.
CUSTOM_INVENTORY=inventory_op_custom.csv

@REM Abort the run if a table or column in the inventory is missing on this
@REM instance. Default n: missing objects are logged as SKIPPED and the run
@REM continues, because the inventory covers several KTP/CTI versions and not
@REM every instance has every table.
@REM Set y for a strict run where any drift from the inventory is a failure.
FAIL_ON_MISSING_OBJECT=n
