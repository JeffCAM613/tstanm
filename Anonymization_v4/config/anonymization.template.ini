@REM ============================================================================
@REM KTP OP Anonymization - Configuration Template
@REM ============================================================================
@REM Copy to 'anonymization.ini' and fill in.
@REM
@REM Any value left BLANK or containing '<' is prompted for at runtime.
@REM Leaving passwords blank is recommended - they are not masked on screen when
@REM typed, but at least they are not stored on disk.
@REM
@REM Lines starting with @REM are comments.
@REM Values are read as NAME=VALUE. Do not quote values.
@REM ============================================================================


@REM ----------------------------------------------------------------------------
@REM Database connection
@REM ----------------------------------------------------------------------------
ORACLE_SID=<SID>
SYS_PASSWORD=<SYS_PASSWORD>
OP_PASSWORD=<OP_PASSWORD>

@REM Tablespaces for the anon_meta metadata schema (mapping, run log, inventory).
@REM These are small - a few MB even on the largest instances.
TABLESPACE_DATA=<DATA_TABLESPACE>
TABLESPACE_INDEX=<INDEX_TABLESPACE>


@REM ----------------------------------------------------------------------------
@REM What to anonymize
@REM ----------------------------------------------------------------------------
@REM These flags are authoritative. A disabled category generates no code
@REM mappings, so its codes are left untouched everywhere in the schema
@REM automatically - there is no per-table exception.
@REM
@REM Accepted values: y / n (case-insensitive; Y, YES, TRUE, 1 also work)
@REM
@REM Disabling a category leaves real client codes in the database. Only do it
@REM if you have a specific reason and know what remains exposed.

@REM Legal entities            -> codes become E_0000001
ANONYMIZE_ENTITY=y
@REM Portfolios                -> codes become P_0000001
ANONYMIZE_PORTFOLIO=y
@REM Counterparties (tiers)    -> codes become T_0000001
ANONYMIZE_COUNTERPARTY=y
@REM Bank accounts             -> codes become CB_0000001
ANONYMIZE_BANK_ACCOUNT=y


@REM ----------------------------------------------------------------------------
@REM Description labels
@REM ----------------------------------------------------------------------------
@REM Replaces the old EntD / FoldD / TierD / CpteD flags.
@REM
@REM Whether the description/label column of each category is overwritten with
@REM that row's anonymized code. Overwriting rather than emptying keeps screens
@REM readable: a counterparty shows as T_0000412 instead of blank.
@REM
@REM Requires the category itself to be enabled above - the value written IS the
@REM anonymized code, so without a mapping there is nothing to write.

ANONYMIZE_ENTITY_DESCRIPTION=y
ANONYMIZE_PORTFOLIO_DESCRIPTION=y
ANONYMIZE_COUNTERPARTY_DESCRIPTION=y
ANONYMIZE_BANK_ACCOUNT_DESCRIPTION=y


@REM ----------------------------------------------------------------------------
@REM Per-entity PII attributes
@REM ----------------------------------------------------------------------------
@REM Replaces the old Ent1-Ent5 / Fold1-5 / Tier1-5 / Cpte1-5 slots.
@REM
@REM Those were five free-form column names per category, each overwritten with
@REM the entity's code. WHICH columns are treated this way is now declared in
@REM config/inventory_op.csv with rule SELF_CODE - so there is no five-column
@REM limit and the list is not restricted to op.tiers and op.compte_banque.
@REM These flags are the on/off switch that Ent1-5 gave you by being set to 'n'.
@REM
@REM Currently covered (see the inventories for the authoritative list):
@REM   in inventory_op.csv         tiers.adresse1-adresse5   (vendor default)
@REM   in inventory_op_custom.csv  entity        tiers.telephone, fax,
@REM                                             email_adress, nom_pp, prenom_pp
@REM                               portfolio     tiers.groupe_1/2/3, flag_pp,
@REM                                             dpt_naissance
@REM                               counterparty  tiers.sector, seniority, telex,
@REM                                             type_interne
@REM                               bank account  compte_banque.groupe_1/2/3
@REM
@REM The 17 columns in the custom file are whatever THIS site put in the old
@REM Ent1-5 / Fold1-5 / Tier1-5 / Cpte1-5 slots, so they live in the
@REM site-specific inventory. Comment out a line there to drop one column;
@REM use the flags below to drop a whole category.
@REM
@REM NOTE: columns marked NULL_OUT in the inventory - free text, names, emails,
@REM phone numbers, IBAN fragments - are ALWAYS erased regardless of every flag
@REM in this file. Free text is the highest-risk category and the least useful
@REM to keep, so it is not made optional.

ANONYMIZE_ENTITY_ATTRIBUTES=y
ANONYMIZE_PORTFOLIO_ATTRIBUTES=y
ANONYMIZE_COUNTERPARTY_ATTRIBUTES=y
ANONYMIZE_BANK_ACCOUNT_ATTRIBUTES=y


@REM ----------------------------------------------------------------------------
@REM Run behaviour
@REM ----------------------------------------------------------------------------

@REM Degree of parallelism for bulk UPDATEs on the large histo_* tables.
@REM Set to 1 to disable parallel DML.
PARALLEL_DEGREE=4

@REM Site-specific coverage additions. Relative to the config folder.
@REM Leave as-is unless you keep the file elsewhere.
CUSTOM_INVENTORY=inventory_op_custom.csv

@REM Abort the run if a table or column in the inventory is missing on this
@REM instance. Default n: missing objects are logged as SKIPPED and the run
@REM continues, because the inventory covers several KTP/CTI versions and not
@REM every instance has every table.
@REM Set y for a strict run where any drift from the inventory is a failure.
FAIL_ON_MISSING_OBJECT=n

@REM Shortest identifier the engine will substitute. Values shorter than this are
@REM left alone: a single character value is a checkbox state ('O', 'x', 'N') far
@REM more often than a client identifier. Lower it only if this site really
@REM uses codes that short - preflight reports how many would be affected.
MIN_CODE_LENGTH=2
