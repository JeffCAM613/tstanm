@REM ============================================================================
@REM KTP OP Anonymization - Configuration (FULL COVERAGE)
@REM ============================================================================
@REM Working configuration. See anonymization.template.ini for the full
@REM explanation of every setting.
@REM
@REM Blank values are prompted for at runtime. Passwords are deliberately left
@REM blank here so they are never written to disk.
@REM ============================================================================


@REM --- Database connection (prompted at runtime) ---
ORACLE_SID=
SYS_PASSWORD=
OP_PASSWORD=
TABLESPACE_DATA=DATA
TABLESPACE_INDEX=DATA


@REM --- Rename identifiers and their references (all on) ---
ANONYMIZE_ENTITY=y
ANONYMIZE_PORTFOLIO=y
ANONYMIZE_COUNTERPARTY=y
ANONYMIZE_UNCLASSIFIED_PARTY=y
ANONYMIZE_BANK_ACCOUNT=y


@REM --- Mask description labels (was EntD / FoldD / TierD / CpteD) ---
ANONYMIZE_ENTITY_DESCRIPTION=y
ANONYMIZE_PORTFOLIO_DESCRIPTION=y
ANONYMIZE_COUNTERPARTY_DESCRIPTION=y
ANONYMIZE_UNCLASSIFIED_PARTY_DESCRIPTION=y
ANONYMIZE_BANK_ACCOUNT_DESCRIPTION=y


@REM --- Mask sensitive attributes and addresses (was Ent1-5 / Fold1-5 / Tier1-5 / Cpte1-5) ---
ANONYMIZE_ENTITY_ATTRIBUTES=y
ANONYMIZE_PORTFOLIO_ATTRIBUTES=y
ANONYMIZE_COUNTERPARTY_ATTRIBUTES=y
ANONYMIZE_UNCLASSIFIED_PARTY_ATTRIBUTES=y
ANONYMIZE_BANK_ACCOUNT_ATTRIBUTES=y


@REM --- Scope decision, per client ---
@REM Compte/w_compte_banque structure nodes with no compte_banque row. Left
@REM blank so it is asked: confirm they are bank accounts for this client.
APPROVE_STRUCTURE_ONLY_ACCOUNTS=


@REM --- Run behaviour ---
PARALLEL_DEGREE=4
CUSTOM_INVENTORY=inventory_op_custom.csv
FAIL_ON_MISSING_OBJECT=n
