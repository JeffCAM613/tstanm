@REM ============================================================================
@REM KTP OP Database Anonymization - Configuration Template
@REM ============================================================================
@REM Copy this file to 'config.ini' and fill in your values.
@REM Any value left as <PLACEHOLDER> or blank will be prompted interactively.
@REM Lines starting with REM or # are comments.
@REM ============================================================================

@REM --- Entities ---
Ent0=y
EntC=y
EntD=y
Ent1=<FIELD_OR_BLANK>
Ent2=<FIELD_OR_BLANK>
Ent3=<FIELD_OR_BLANK>
Ent4=<FIELD_OR_BLANK>
Ent5=<FIELD_OR_BLANK>

@REM --- Folders ---
Fold0=y
FoldC=y
FoldD=y
Fold1=<FIELD_OR_BLANK>
Fold2=<FIELD_OR_BLANK>
Fold3=<FIELD_OR_BLANK>
Fold4=<FIELD_OR_BLANK>
Fold5=<FIELD_OR_BLANK>

@REM --- Counterparties (Tiers) ---
Tier0=y
TierC=y
TierD=y
Tier1=<FIELD_OR_BLANK>
Tier2=<FIELD_OR_BLANK>
Tier3=<FIELD_OR_BLANK>
Tier4=<FIELD_OR_BLANK>
Tier5=<FIELD_OR_BLANK>

@REM --- Bank Accounts ---
Cpte0=y
CpteC=y
CpteD=y
Cpte1=<FIELD_OR_BLANK>
Cpte2=<FIELD_OR_BLANK>
Cpte3=<FIELD_OR_BLANK>
Cpte4=<FIELD_OR_BLANK>
Cpte5=<FIELD_OR_BLANK>

@REM --- Database Connection ---
@REM Leave blank or <PLACEHOLDER> to be prompted at runtime (recommended for passwords)
ORACLE_SID=<SID>
SYSPWD=<SYS_PASSWORD>
OPPWD=<OP_PASSWORD>
TBSDATA=<DATA_TABLESPACE>
TBSINDEX=<INDEX_TABLESPACE>