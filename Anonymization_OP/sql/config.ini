@REM ============================================================================
@REM KTP OP Database Anonymization - Configuration (FULL COVERAGE)
@REM Instance: <SET_YOUR_INSTANCE>
@REM ============================================================================
@REM
@REM Each category has: X0=y/n (process category), XC=y/n (rename code),
@REM XD=y/n (overwrite description), X1-X5=<column_name> or n (extra fields).
@REM Extra fields are overwritten with the entity's anonymized code.
@REM Set to 'n' if no column to anonymize in that slot.
@REM ============================================================================

@REM --- Entities (op.tiers WHERE flag_portefeuille='N', structure='Entite') ---
Ent0=y
EntC=y
EntD=y
Ent1=telephone
Ent2=fax
Ent3=email_adress
Ent4=nom_pp
Ent5=prenom_pp

@REM --- Folders/Portfolios (op.tiers WHERE flag_portefeuille='O') ---
Fold0=y
FoldC=y
FoldD=y
Fold1=groupe_1
Fold2=groupe_2
Fold3=groupe_3
Fold4=flag_pp
Fold5=dpt_naissance

@REM --- Counterparties (op.tiers WHERE structure='Compte', ecran='w_tiers') ---
Tier0=y
TierC=y
TierD=y
Tier1=sector
Tier2=seniority
Tier3=telex
Tier4=type_interne
Tier5=n

@REM --- Bank Accounts (op.compte_banque) ---
Cpte0=y
CpteC=y
CpteD=y
Cpte1=groupe_1
Cpte2=groupe_2
Cpte3=groupe_3
Cpte4=n
Cpte5=n

@REM --- Database Connection ---
@REM Leave blank to be prompted at runtime (recommended for passwords)
ORACLE_SID=
SYSPWD=
OPPWD=
TBSDATA=DATA
TBSINDEX=DATA